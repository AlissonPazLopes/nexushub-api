services:
  postgres:
    image: postgres:16-alpine
    container_name: nexushub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexushub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - nexushub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexushub_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexushub-redis
    ports:
      - "6379:6379"
    volumes:
      - nexushub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nexushub_pgdata:
  nexushub_redisdata:
